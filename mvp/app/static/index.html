<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f5f7">
  <title>Делим чек</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: var(--tg-theme-bg-color, #f4f5f7);
      --surface: var(--tg-theme-secondary-bg-color, #fff);
      --text: var(--tg-theme-text-color, #17191c);
      --muted: var(--tg-theme-hint-color, #777e87);
      --line: color-mix(in srgb, var(--text) 10%, transparent);
      --accent: var(--tg-theme-button-color, #2787f5);
      --accent-text: var(--tg-theme-button-text-color, #fff);
      --danger: #c83e4d;
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0 16px calc(24px + env(safe-area-inset-bottom));
      background: var(--bg); color: var(--text);
      font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { max-width: 560px; margin: 0 auto; padding-top: max(18px, env(safe-area-inset-top)); }
    header { margin: 8px 2px 18px; }
    .eyebrow { color: var(--muted); font-size: 13px; font-weight: 600; letter-spacing: .02em; }
    h1 { margin: 4px 0 0; font-size: 26px; line-height: 1.2; overflow-wrap: anywhere; }
    .status { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; color: var(--muted); font-size: 13px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #28a46a; }
    .dot.closed { background: var(--muted); }
    .card { background: var(--surface); border-radius: var(--radius); padding: 16px; margin: 12px 0; }
    .section-title { margin: 0 0 8px; font-size: 16px; font-weight: 700; }
    .helper { margin: 0; color: var(--muted); font-size: 14px; }
    .item { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line); }
    .item:last-child { border-bottom: 0; padding-bottom: 0; }
    .item:first-child { padding-top: 8px; }
    .item-info { min-width: 0; flex: 1; }
    .item-name { font-weight: 600; overflow-wrap: anywhere; }
    .item-meta { margin-top: 3px; color: var(--muted); font-size: 13px; }
    .price { white-space: nowrap; font-weight: 650; font-variant-numeric: tabular-nums; }
    button { border: 0; border-radius: 12px; min-height: 42px; padding: 0 14px; font: inherit; font-weight: 650; cursor: pointer; }
    button:disabled { opacity: .48; cursor: default; }
    .primary { color: var(--accent-text); background: var(--accent); }
    .secondary { color: var(--text); background: color-mix(in srgb, var(--text) 8%, transparent); }
    .small-button { min-height: 36px; padding: 0 12px; font-size: 14px; }
    .amount-card { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .amount { font-size: 24px; font-weight: 750; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .payment { overflow-wrap: anywhere; }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    .actions button { flex: 1; }
    .person { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
    .person:last-child { border-bottom: 0; }
    .person span:last-child { white-space: nowrap; font-weight: 650; font-variant-numeric: tabular-nums; }
    .notice { border-radius: 12px; background: color-mix(in srgb, var(--danger) 10%, transparent); color: var(--danger); padding: 11px 13px; margin: 12px 0; font-size: 14px; }
    .notice[hidden], [hidden] { display: none !important; }
    .empty { padding: 18px 0 4px; color: var(--muted); text-align: center; }
    .footer { display: flex; justify-content: center; margin-top: 16px; }
    .link-button { color: var(--accent); background: transparent; min-height: 38px; }
    @media (prefers-color-scheme: dark) { :root { --danger: #ff737d; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">ДЕЛИМ ЧЕК</div>
      <h1 id="title">Загружаем чек…</h1>
      <div class="status"><span id="status-dot" class="dot"></span><span id="status-text">Обновляем данные</span></div>
    </header>

    <div id="message" class="notice" role="alert" hidden></div>
    <section class="card">
      <h2 class="section-title">Блюда</h2>
      <p id="items-help" class="helper">Отметь блюда, которые ты ел.</p>
      <div id="items"></div>
    </section>

    <section class="card amount-card" aria-live="polite">
      <div><div class="eyebrow" id="amount-label">ТВОЯ СУММА</div><div class="helper" id="amount-note">Обновляется после отметок</div></div>
      <div class="amount" id="amount">—</div>
    </section>

    <section id="payment-card" class="card" hidden>
      <h2 class="section-title">Перевод плательщику</h2>
      <p id="payment-info" class="helper payment"></p>
      <div class="actions"><button id="copy-payment" class="secondary">Скопировать реквизиты</button></div>
    </section>

    <section id="payer-card" class="card" hidden>
      <h2 class="section-title">Сводка по чеку</h2>
      <div id="totals"></div>
      <div id="unclaimed" class="empty" hidden>Все блюда распределены</div>
      <div class="actions"><button id="close-check" class="secondary">Закрыть чек</button></div>
    </section>

    <div class="footer"><button id="refresh" class="link-button">Обновить</button></div>
  </main>

  <script>
    const tg = window.Telegram?.WebApp || null;
    if (tg) { tg.ready(); tg.expand(); }

    const params = new URLSearchParams(location.search);
    const startParam = tg?.initDataUnsafe?.start_param || "";
    const checkId = startParam.startsWith("check_") ? startParam.slice(6) : params.get("check");
    const initData = tg?.initData || params.get("auth") || "";
    let currentState = null;
    let currentMe = null;
    let busy = false;

    const $ = (id) => document.getElementById(id);
    const rub = (kopecks) => (kopecks / 100).toLocaleString("ru-RU", {
      minimumFractionDigits: 2, maximumFractionDigits: 2
    }) + " ₽";

    function setMessage(text = "") {
      $("message").textContent = text;
      $("message").hidden = !text;
    }

    async function api(method, path) {
      const response = await fetch(path, {
        method,
        headers: { Authorization: "tma " + initData }
      });
      if (!response.ok) {
        let message = "Ошибка " + response.status;
        try {
          const body = await response.json();
          if (typeof body.detail === "string") message = body.detail;
        } catch (_) {}
        throw new Error(message);
      }
      return response.status === 204 ? null : response.json();
    }

    function button(label, className, onClick, disabled = false) {
      const el = document.createElement("button");
      el.textContent = label;
      el.className = className;
      el.disabled = disabled;
      el.addEventListener("click", onClick);
      return el;
    }

    function renderItems(state) {
      const list = $("items");
      list.replaceChildren();
      if (!state.items.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "В этом чеке пока нет блюд.";
        list.append(empty);
        return;
      }

      for (const item of state.items) {
        const row = document.createElement("div");
        row.className = "item";
        const info = document.createElement("div");
        info.className = "item-info";
        const name = document.createElement("div");
        name.className = "item-name";
        name.textContent = item.name;
        const meta = document.createElement("div");
        meta.className = "item-meta";
        meta.textContent = item.type === "shared"
          ? `Общее · ${item.claims_count} отметок`
          : item.claims_count ? "Индивидуальное · занято" : "Индивидуальное";
        info.append(name, meta);
        const price = document.createElement("div");
        price.className = "price";
        price.textContent = rub(item.price);
        row.append(info, price);

        if (state.status !== "closed") {
          const occupied = item.type === "single" && item.claims_count > 0 && !item.mine;
          const action = item.mine ? "Снять" : occupied ? "Занято" : "Я ел";
          row.append(button(action, item.mine ? "secondary small-button" : "primary small-button",
            () => toggle(item), occupied || busy));
        } else if (item.mine) {
          const mine = document.createElement("span");
          mine.className = "item-meta";
          mine.textContent = "Моё";
          row.append(mine);
        }
        list.append(row);
      }
    }

    function renderPayer(summary) {
      const list = $("totals");
      list.replaceChildren();
      for (const person of summary.totals) {
        const row = document.createElement("div");
        row.className = "person";
        const name = document.createElement("span");
        name.textContent = person.name;
        const amount = document.createElement("span");
        amount.textContent = rub(person.amount);
        row.append(name, amount);
        list.append(row);
      }
      $("unclaimed").hidden = summary.unclaimed_items.length === 0;
      if (summary.unclaimed_items.length) {
        $("unclaimed").textContent = `Никто не взял: ${summary.unclaimed_items.map(item => item.name).join(", ")}`;
      }
    }

    function render(state, me, summary) {
      currentState = state;
      currentMe = me;
      $("title").textContent = state.title || `Чек №${state.id}`;
      const closed = state.status === "closed";
      $("status-text").textContent = closed ? "Чек закрыт" : "Чек открыт";
      $("status-dot").classList.toggle("closed", closed);
      $("items-help").textContent = closed ? "Отметки по чеку закрыты." : "Отметь блюда, которые ты ел.";
      $("amount").textContent = rub(me.amount);
      $("amount-label").textContent = me.is_payer ? "ТЫ ОПЛАТИЛ" : closed ? "ТВОЯ ДОЛЯ" : "ТВОЯ СУММА";
      $("amount-note").textContent = closed ? "Итоговая сумма по твоим отметкам" : "Пересчитывается после каждой отметки";

      const showPayment = !me.is_payer && !!me.payment_info && me.amount > 0;
      $("payment-card").hidden = !showPayment;
      $("payment-info").textContent = me.payment_info || "";
      $("payer-card").hidden = !me.is_payer;
      $("close-check").hidden = closed;
      $("close-check").disabled = busy;
      if (me.is_payer && summary) renderPayer(summary);
      renderItems(state);
    }

    async function load() {
      if (!checkId) {
        $("title").textContent = "Чек не найден";
        setMessage("Открой приложение по ссылке на чек: в ссылке должен быть указан номер чека.");
        return;
      }
      if (!/^\d+$/.test(checkId)) {
        setMessage("В ссылке указан некорректный номер чека.");
        return;
      }
      setMessage("");
      try {
        const [state, me] = await Promise.all([
          api("GET", `/checks/${checkId}/state`),
          api("GET", `/checks/${checkId}/me`)
        ]);
        const summary = me.is_payer ? await api("GET", `/checks/${checkId}/summary`) : null;
        render(state, me, summary);
      } catch (error) {
        setMessage(error.message || "Не удалось загрузить чек. Попробуй обновить экран.");
      }
    }

    async function toggle(item) {
      if (busy) return;
      busy = true;
      setMessage("");
      if (currentState && currentMe) render(currentState, currentMe, null);
      try {
        await api(item.mine ? "DELETE" : "POST", `/items/${item.id}/claim`);
      } catch (error) {
        setMessage(error.message);
      } finally {
        busy = false;
        await load();
      }
    }

    $("copy-payment").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(currentMe.payment_info);
        $("copy-payment").textContent = "Скопировано";
        setTimeout(() => { $("copy-payment").textContent = "Скопировать реквизиты"; }, 1800);
      } catch (_) {
        setMessage("Не получилось скопировать. Выдели и скопируй реквизиты вручную.");
      }
    });

    $("close-check").addEventListener("click", async () => {
      if (busy || !currentState || currentState.status === "closed") return;
      busy = true;
      $("close-check").disabled = true;
      setMessage("");
      try {
        await api("POST", `/checks/${checkId}/close`);
        await load();
      } catch (error) {
        setMessage(error.message);
      } finally {
        busy = false;
        if (currentState) render(currentState, currentMe, null);
      }
    });

    $("refresh").addEventListener("click", load);
    load();
  </script>
</body>
</html>
